name: Daily Finance Update

# ─────────────────────────────────────────────────────────────
# 自动化核心：这条工作流就是老师要验收的“无人值守定时任务”
# - schedule: 每个交易日北京时间 16:00 自动跑（cron 用 UTC，16:00 北京 = 08:00 UTC）
# - workflow_dispatch: 允许在 GitHub 网页上手动点一下立即跑（调试用）
# - permissions: contents: write 允许提交数据；issues: write 允许失败自动开告警 Issue
# ─────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '0 8 * * 1-5'     # 周一至周五 08:00 UTC = 北京 16:00
  workflow_dispatch:          # 手动触发入口

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo        # 拉取仓库（含上一次生成的 data.js）
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install akshare (best-effort)   # 装不上也不阻断流水线，脚本会自动降级
        run: python -m pip install akshare
        continue-on-error: true

      - name: Run fetch script     # 采集 → 生成 data.js
        run: python agent/fetch_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: auto-update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      # ── Phase 3：失败自动告警 ──
      # 读取刚生成的 data.js 的 status 字段：
      #   degraded → 开一个告警 Issue（若已有未关闭的则不再重复开）
      #   ok       → 自动关闭遗留的告警 Issue（自愈）
      - name: Alert on degraded (open / close Issue)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(python -c "import json,re; t=open('data.js',encoding='utf-8').read(); d=json.loads(t[t.index('=')+1:].rstrip().rstrip(';')); print(d['status'])")
          if [ "$STATUS" = "degraded" ]; then
            OPEN=$(gh issue list --label automation-alert --state open --json number --jq 'length')
            if [ "$OPEN" = "0" ]; then
              DETAIL=$(python -c "import json,re; t=open('data.js',encoding='utf-8').read(); d=json.loads(t[t.index('=')+1:].rstrip().rstrip(';')); print(' | '.join(l['detail'] for l in d.get('logs',[]) if l.get('level')=='error')[:600])")
              gh issue create --title "⚠️ 金融站自动更新降级 $(date -u +%Y-%m-%d)" --label automation-alert --body "自动化流水线检测到降级，详情：$DETAIL"
            else
              echo "已有未关闭的告警 Issue，跳过新建"
            fi
          else
            echo "状态正常，检查并关闭遗留告警"
            gh issue list --label automation-alert --state open --json number --jq '.[]|.number' | while read n; do
              gh issue close "$n" --comment "已恢复正常，自动关闭告警" || true
            done
          fi
