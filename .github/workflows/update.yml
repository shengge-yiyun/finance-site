# 适配仓库结构：index.html / data.js 在根目录，抓取脚本在 agent/fetch_data.py
name: Daily Finance Update

on:
  schedule:
    - cron: "0 8 * * 1-5"   # UTC 08:00 = 北京时间 16:00，周一至周五交易日
  workflow_dispatch:        # 允许在 Actions 页面手动点 "Run workflow" 立即跑
  push:
    branches: [main]
    paths:
      - 'agent/**'          # 采集脚本变更时自动跑一次，刷新数据

permissions:
  contents: write           # 允许 workflow 把刷新后的 data.js 写回仓库

concurrency:
  group: finance-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 拉全量历史，保留 history 快照累积

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Fetch live data (AKShare)
        run: python agent/fetch_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data/history.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto: 更新金融数据 $(date +'%Y-%m-%d')"
            git push
          fi
