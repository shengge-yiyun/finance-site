name: Daily Finance Update

on:
  schedule:
    # 北京时间周一至周五 16:00 = UTC 08:00
    - cron: '0 8 * * 1-5'
  workflow_dispatch:        # 允许手动触发
  push:
    branches: [main]
    paths:
      - 'agent/**'          # 采集脚本变更时自动跑一次，确保数据文件也更新

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # 允许推送 data.js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install akshare

      - name: Run collector
        run: python agent/fetch_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "finance-bot"
          git config user.email "bot@finance-site.local"
          git add data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: daily update $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          fi
